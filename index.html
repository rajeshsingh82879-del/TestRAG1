<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Line &amp; Ledger — Restaurant Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
<style>
  :root{
    --charcoal:#2b2926;
    --charcoal-2:#3a3630;
    --cream:#faf6ee;
    --paper:#fffdf8;
    --ink:#25221e;
    --ink-soft:#5c574d;
    --amber:#b96e15;
    --amber-deep:#8a5210;
    --amber-tint:#f4e3c8;
    --sage:#5c7350;
    --sage-tint:#e4ebdd;
    --rust:#a13d2a;
    --rust-tint:#f6ded7;
    --line:#e6ddc9;
    --line-strong:#d8cbaa;
    --shadow:0 1px 2px rgba(43,41,38,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1180px;margin:0 auto;padding-bottom:80px;}

  /* header */
  .masthead{
    background:var(--charcoal);
    color:var(--cream);
    padding:22px 28px 0;
    border-bottom:4px solid var(--amber);
  }
  .masthead-top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand-mark{
    font-family:'Fraunces',serif;font-weight:600;font-size:15px;
    background:var(--amber);color:var(--charcoal);
    padding:3px 8px;border-radius:3px;letter-spacing:0.04em;
  }
  .brand h1{
    font-family:'Fraunces',serif;font-weight:600;font-size:26px;margin:0;
    letter-spacing:0.01em;
  }
  .brand-sub{font-size:12px;color:#c9c2b2;font-family:'JetBrains Mono',monospace;letter-spacing:0.03em;}
  .today-tag{font-family:'JetBrains Mono',monospace;font-size:12px;color:#c9c2b2;}

  .nav{display:flex;gap:2px;margin-top:6px;}
  .nav button{
    appearance:none;border:none;background:transparent;color:#d9d2c1;
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    padding:11px 18px;cursor:pointer;border-radius:6px 6px 0 0;
    display:flex;align-items:center;gap:7px;transition:background .12s, color .12s;
  }
  .nav button:hover{background:rgba(255,255,255,0.06);color:#fff;}
  .nav button.active{background:var(--cream);color:var(--charcoal);}
  .nav svg{width:15px;height:15px;flex:none;}

  /* location rail */
  .loc-rail{
    display:flex;align-items:center;gap:8px;padding:14px 28px;
    background:var(--paper);border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .loc-rail-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);font-weight:600;margin-right:4px;}
  .station{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;
    padding:6px 12px;border-radius:20px;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink-soft);cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:all .12s;
  }
  .station:hover{border-color:var(--amber);color:var(--ink);}
  .station.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--cream);}
  .station .dot{width:6px;height:6px;border-radius:50%;background:var(--sage);flex:none;}
  .manage-loc-btn{
    margin-left:auto;font-size:12px;color:var(--amber-deep);background:none;border:none;
    cursor:pointer;font-weight:600;display:flex;align-items:center;gap:5px;
  }

  main{padding:24px 28px 0;}
  .page-title{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .page-title h2{font-family:'Fraunces',serif;font-weight:600;font-size:21px;margin:0;}
  .page-title .sub{font-size:13px;color:var(--ink-soft);}

  /* buttons */
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:9px 16px;border-radius:6px;border:1px solid var(--line-strong);
    background:var(--paper);color:var(--ink);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .12s;
  }
  .btn:hover{border-color:var(--amber);}
  .btn-primary{background:var(--amber);border-color:var(--amber-deep);color:#fff;}
  .btn-primary:hover{background:var(--amber-deep);}
  .btn-ghost{border-color:transparent;background:transparent;padding:6px 8px;}
  .btn-ghost:hover{background:var(--amber-tint);border-color:transparent;}
  .btn-danger-ghost{border-color:transparent;background:transparent;padding:6px 8px;color:var(--rust);}
  .btn-danger-ghost:hover{background:var(--rust-tint);}
  .btn svg{width:14px;height:14px;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}

  /* metric cards */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:26px;}
  .metric{
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .metric::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);}
  .metric.sage::before{background:var(--sage);}
  .metric.rust::before{background:var(--rust);}
  .metric-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .metric-value{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700;color:var(--ink);}
  .metric-note{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  /* section card */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden;box-shadow:var(--shadow);}
  .card-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px dashed var(--line-strong);
    background:linear-gradient(var(--cream), var(--paper));
  }
  .card-head h3{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0;}
  .card-body{padding:6px 0;}
  .card-body.pad{padding:16px 18px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;
    color:var(--ink-soft);font-weight:700;padding:10px 18px;border-bottom:1px solid var(--line);
    background:#fbf8f1;
  }
  tbody td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbf7ee;}
  td.num,th.num{font-family:'JetBrains Mono',monospace;text-align:right;}
  td.mono{font-family:'JetBrains Mono',monospace;}

  .tag{
    display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:0.03em;
  }
  .tag-ok{background:var(--sage-tint);color:#3c5033;}
  .tag-low{background:var(--amber-tint);color:var(--amber-deep);}
  .tag-out{
    background:var(--rust-tint);color:var(--rust);border:1.5px solid var(--rust);
    transform:rotate(-2deg);font-family:'JetBrains Mono',monospace;
  }
  .loc-chip{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);background:#f1ebd9;padding:2px 8px;border-radius:4px;}

  .empty{padding:46px 20px;text-align:center;}
  .empty h4{font-family:'Fraunces',serif;font-size:17px;margin:0 0 6px;}
  .empty p{font-size:13.5px;color:var(--ink-soft);margin:0 0 16px;}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(37,34,30,0.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal{
    background:var(--paper);border-radius:12px;max-width:480px;width:100%;
    max-height:88vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.25);
  }
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);}
  .modal-head h3{font-family:'Fraunces',serif;font-size:17px;margin:0;}
  .modal-body{padding:18px 20px;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:6px;
    font-family:'Inter',sans-serif;font-size:13.5px;background:var(--paper);color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--amber);outline-offset:1px;border-color:var(--amber);}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  /* attendance grid */
  .att-toolbar{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap;border-bottom:1px dashed var(--line-strong);}
  .att-toolbar input[type=date]{padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;}
  .att-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);}
  .att-row:last-child{border-bottom:none;}
  .att-name{flex:1;min-width:140px;}
  .att-name .role{font-size:11.5px;color:var(--ink-soft);}
  .status-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .status-btn{
    font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:6px;border:1px solid var(--line-strong);
    background:var(--paper);cursor:pointer;text-transform:uppercase;letter-spacing:0.02em;
  }
  .status-btn.present.on{background:var(--sage);border-color:var(--sage);color:#fff;}
  .status-btn.late.on{background:var(--amber);border-color:var(--amber-deep);color:#fff;}
  .status-btn.absent.on{background:var(--rust);border-color:var(--rust);color:#fff;}
  .status-btn.off.on{background:var(--charcoal);border-color:var(--charcoal);color:#fff;}

  .stamp-corner{position:relative;}
  .footnote{font-size:11.5px;color:var(--ink-soft);padding:10px 18px;font-family:'JetBrains Mono',monospace;}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px;}

  @media (max-width:720px){
    .field-row{grid-template-columns:1fr;}
    main{padding:18px 14px 0;}
    .masthead{padding:18px 14px 0;}
    .loc-rail{padding:12px 14px;}
    thead{display:none;}
    table, tbody, tr, td{display:block;width:100%;}
    tbody tr{border-bottom:1px solid var(--line);padding:8px 0;}
    tbody td{border-bottom:none;padding:4px 18px;display:flex;justify-content:space-between;gap:10px;}
    td.num{text-align:right;}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div style="padding:60px;text-align:center;font-family:'JetBrains Mono',monospace;color:#8a8377;">Loading the line…</div>
</div>

<script>
/* ---------- constants ---------- */
const STORAGE_KEY = 'lineledger-state-v1';
const CATEGORIES = ['Produce','Meat & Poultry','Seafood','Dairy','Dry Goods','Beverages','Bakery','Cleaning Supplies','Paper Goods','Other'];
const UNITS = ['lb','oz','kg','g','each','case','gal','L','box','bag'];
const ROLES = ['Line Cook','Prep Cook','Server','Bartender','Host','Dishwasher','Sous Chef','Executive Chef','Manager','Delivery'];
const STATUSES = ['present','late','absent','off'];
const STATUS_LABEL = {present:'Present', late:'Late', absent:'Absent', off:'Day off'};

const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
  inventory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  employees:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.5 14.2c2.8.4 5 2.6 5 5.8"/></svg>',
  attendance:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><path d="M8.5 14l2 2 4-4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.9l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.9-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1-1.6 1.7 1.7 0 00-1.9.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.9 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1 1.7 1.7 0 00-.3-1.9l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.9.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.9-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.9V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};

/* ---------- state ---------- */
let state = null;
let view = { tab: 'dashboard', locationId: 'all', attDate: todayStr(), attLocFilter: 'all', invSearch: '', invCatFilter: 'all', historyEmpFilter: 'all' };
let modal = null; // {type, payload}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function money(n){ return '$' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function defaultState(){
  return {
    locations: [1,2,3,4,5].map(n => ({id: 'loc'+n, name: 'Location '+n})),
    inventory: [],
    employees: [],
    attendance: []
  };
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    state = res && res.value ? JSON.parse(res.value) : defaultState();
  }catch(e){
    state = defaultState();
  }
  render();
}

let saving = false, savePending = false;
async function saveState(){
  if(saving){ savePending = true; return; }
  saving = true;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
  }catch(e){
    console.error('Save failed', e);
  }
  saving = false;
  if(savePending){ savePending = false; saveState(); }
}

function persistAndRender(){ saveState(); render(); }

/* ---------- derived helpers ---------- */
function locName(id){ const l = state.locations.find(x=>x.id===id); return l ? l.name : '—'; }
function scopedInventory(){
  return view.locationId==='all' ? state.inventory : state.inventory.filter(i=>i.locationId===view.locationId);
}
function scopedEmployees(locId){
  const scope = locId===undefined ? view.locationId : locId;
  return scope==='all' ? state.employees : state.employees.filter(e=>e.locationId===scope);
}
function itemStatus(item){
  if(item.quantity<=0) return 'out';
  if(item.quantity <= item.reorderLevel) return 'low';
  return 'ok';
}
function totalValue(items){ return items.reduce((s,i)=>s+ (i.quantity*i.unitPrice), 0); }

/* ---------- render root ---------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = renderMasthead() + renderLocRail() + '<main>' + renderTab() + '</main>' + renderModal();
  attachGlobalHandlers();
}

function renderMasthead(){
  return `
  <div class="masthead">
    <div class="masthead-top">
      <div class="brand">
        <span class="brand-mark">L&amp;L</span>
        <div>
          <h1>Line &amp; Ledger</h1>
          <div class="brand-sub">RESTAURANT OPERATIONS · ${state.locations.length} LOCATIONS</div>
        </div>
      </div>
      <div class="today-tag">${new Date().toLocaleDateString(undefined,{weekday:'long', year:'numeric', month:'long', day:'numeric'})}</div>
    </div>
    <nav class="nav">
      ${navBtn('dashboard','Dashboard')}
      ${navBtn('inventory','Inventory')}
      ${navBtn('employees','Employees')}
      ${navBtn('attendance','Attendance')}
    </nav>
  </div>`;
}
function navBtn(id,label){
  return `<button class="${view.tab===id?'active':''}" data-nav="${id}">${ICONS[id]}${label}</button>`;
}

function renderLocRail(){
  const stations = state.locations.map(l => `
    <button class="station ${view.locationId===l.id?'active':''}" data-loc="${l.id}">
      <span class="dot"></span>${esc(l.name)}
    </button>`).join('');
  return `
  <div class="loc-rail">
    <span class="loc-rail-label">Station</span>
    <button class="station ${view.locationId==='all'?'active':''}" data-loc="all">All locations</button>
    ${stations}
    <button class="manage-loc-btn" data-action="manage-locations">${ICONS.settings} Manage locations</button>
  </div>`;
}

function renderTab(){
  if(view.tab==='dashboard') return renderDashboard();
  if(view.tab==='inventory') return renderInventory();
  if(view.tab==='employees') return renderEmployees();
  if(view.tab==='attendance') return renderAttendance();
  return '';
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const inv = scopedInventory();
  const emp = scopedEmployees();
  const val = totalValue(inv);
  const low = inv.filter(i=>itemStatus(i)==='low').length;
  const out = inv.filter(i=>itemStatus(i)==='out').length;
  const today = todayStr();
  const todaysAtt = state.attendance.filter(a=>a.date===today && (view.locationId==='all' || a.locationId===view.locationId));
  const presentCount = todaysAtt.filter(a=>a.status==='present'||a.status==='late').length;
  const rosterSize = emp.length;
  const rate = rosterSize ? Math.round((presentCount/rosterSize)*100) : 0;

  const scopeLabel = view.locationId==='all' ? 'across all locations' : 'at '+esc(locName(view.locationId));

  const lowRows = inv.filter(i=>itemStatus(i)!=='ok').sort((a,b)=>itemStatus(a)===itemStatus(b)?0:(itemStatus(a)==='out'?-1:1)).slice(0,8);

  const byLocation = view.locationId==='all' ? state.locations.map(l=>{
    const li = state.inventory.filter(i=>i.locationId===l.id);
    return {name:l.name, val: totalValue(li), count: li.length};
  }) : [];

  return `
  <div class="page-title">
    <h2>Dashboard</h2>
    <div class="sub">Snapshot ${scopeLabel}</div>
  </div>
  <div class="metrics">
    <div class="metric">
      <div class="metric-label">Inventory value</div>
      <div class="metric-value">${money(val)}</div>
      <div class="metric-note">${inv.length} item${inv.length===1?'':'s'} tracked</div>
    </div>
    <div class="metric ${low||out?'rust':'sage'}">
      <div class="metric-label">Needs attention</div>
      <div class="metric-value">${low+out}</div>
      <div class="metric-note">${out} out of stock · ${low} running low</div>
    </div>
    <div class="metric">
      <div class="metric-label">Employees</div>
      <div class="metric-value">${rosterSize}</div>
      <div class="metric-note">on the roster ${scopeLabel}</div>
    </div>
    <div class="metric sage">
      <div class="metric-label">Today's attendance</div>
      <div class="metric-value">${rosterSize? rate+'%' : '—'}</div>
      <div class="metric-note">${presentCount} of ${rosterSize} checked in</div>
    </div>
  </div>

  ${byLocation.length ? `
  <div class="card">
    <div class="card-head"><h3>Inventory value by location</h3></div>
    <div class="card-body">

function statusTag(s){

}

/* ---------- ATTENDANCE ---------- */
function renderAttendance(){
  const date = view.attDate;
  const locFilter = view.attLocFilter;
  const roster = (locFilter==='all' ? state.employees : state.employees.filter(e=>e.locationId===locFilter));
  const records = state.attendance.filter(a=>a.date===date);
  const recMap = {}; records.forEach(r=>recMap[r.employeeId]=r);

  const counts = {present:0, late:0, absent:0, off:0};
  roster.forEach(e=>{ const r = recMap[e.id]; if(r) counts[r.status]++; });

  const historyEmp = view.historyEmpFilter;
  let history = state.attendance.slice().sort((a,b)=> a.date<b.date?1:-1);
  if(historyEmp!=='all') history = history.filter(h=>h.employeeId===historyEmp);
  history = history.slice(0,40);

  return `
  <div class="page-title">
    <h2>Attendance</h2>
    <div class="sub">Mark today's roster, or pick another date</div>
  </div>

  <div class="metrics">
    <div class="metric sage"><div class="metric-label">Present</div><div class="metric-value">${counts.present}</div></div>
    <div class="metric"><div class="metric-label">Late</div><div class="metric-value">${counts.late}</div></div>
    <div class="metric rust"><div class="metric-label">Absent</div><div class="metric-value">${counts.absent}</div></div>
    <div class="metric"><div class="metric-label">Day off</div><div class="metric-value">${counts.off}</div></div>
  </div>

  <div class="card">
    <div class="att-toolbar">
      <input type="date" value="${date}" data-input="att-date">
      <select data-input="att-loc" style="padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;">
        <option value="all" ${locFilter==='all'?'selected':''}>All locations</option>
        ${state.locations.map(l=>`<option value="${l.id}" ${locFilter===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card-body">
      ${roster.length ? roster.map(e=>{
        const r = recMap[e.id];
        const cur = r ? r.status : null;
        return `
        <div class="att-row">
          <div class="att-name">
            <div>${esc(e.name)}</div>
            <div class="role">${esc(e.role)} · ${esc(locName(e.locationId))}</div>
          </div>
          <div class="status-btns">
            ${STATUSES.map(s=>`<button class="status-btn ${s} ${cur===s?'on':''}" data-action="mark-att" data-emp="${e.id}" data-status="${s}" data-loc="${e.locationId}">${STATUS_LABEL[s]}</button>`).join('')}
          </div>
        </div>`;
      }).join('') : `<div class="empty"><h4>No employees to mark</h4><p>Add employees first, then come back to take attendance.</p></div>`}
    </div>
  </div>

  <div class="card">
    <div class="card-head" style="gap:10px;flex-wrap:wrap;">
      <h3>Recent history</h3>
      <select data-input="hist-emp" style="padding:8px 11px;border:1px solid var(--line-strong);border-radius:6px;font-size:13px;">
        <option value="all" ${historyEmp==='all'?'selected':''}>All employees</option>
        ${state.employees.map(e=>`<option value="${e.id}" ${historyEmp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}
      </select>
    </div>
    <div class="card-body">
      ${history.length ? `
      <table>
        <thead><tr><th>Date</th><th>Employee</th><th>Location</th><th>Status</th><th></th></tr></thead>
        <tbody>
        ${history.map(h=>{
          const e = state.employees.find(x=>x.id===h.employeeId);
          return `<tr>
            <td class="mono">${h.date}</td>
            <td>${esc(e?e.name:'Removed employee')}</td>
            <td><span class="loc-chip">${esc(locName(h.locationId))}</span></td>
            <td>${attStatusTag(h.status)}</td>
            <td class="num"><button class="btn-danger-ghost btn" data-action="delete-att" data-id="${h.id}">${ICONS.trash}</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>` : `<div class="empty"><h4>No records yet</h4><p>Marked attendance will show up here.</p></div>`}
    </div>
  </div>`;
}
function attStatusTag(s){
  const map = {present:'tag-ok', late:'tag-low', absent:'tag-out', off:''};
  if(s==='off') return `<span class="tag" style="background:#efeade;color:#5c574d;">Day off</span>`;
  return `<span class="tag ${map[s]}">${STATUS_LABEL[s]}</span>`;
}

/* ---------- event wiring ---------- */
function attachGlobalHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(b=>b.onclick = ()=>{ view.tab = b.dataset.nav; render(); });
  app.querySelectorAll('[data-loc]').forEach(b=>b.onclick = ()=>{ view.locationId = b.dataset.loc; render(); });

  const overlay = app.querySelector('[data-overlay]');
  if(overlay) overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay){ modal=null; render(); } });

  app.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (ev)=>{
      const action = el.dataset.action;
      const id = el.dataset.id;
      handleAction(action, id, el);
    };
  });

  const searchInput = app.querySelector('[data-input="inv-search"]');
  if(searchInput){
    searchInput.oninput = ()=>{ view.invSearch = searchInput.value; renderInPlaceInventory(); };
    searchInput.focus();
    searchInput.setSelectionRange(searchInput.value.length, searchInput.value.length);
  }
  const catSelect = app.querySelector('[data-input="inv-cat"]');
  if(catSelect) catSelect.onchange = ()=>{ view.invCatFilter = catSelect.value; render(); };

  const attDate = app.querySelector('[data-input="att-date"]');
  if(attDate) attDate.onchange = ()=>{ view.attDate = attDate.value; render(); };
  const attLoc = app.querySelector('[data-input="att-loc"]');
  if(attLoc) attLoc.onchange = ()=>{ view.attLocFilter = attLoc.value; render(); };
  const histEmp = app.querySelector('[data-input="hist-emp"]');
  if(histEmp) histEmp.onchange = ()=>{ view.historyEmpFilter = histEmp.value; render(); };
}

// lightweight re-render for search typing so focus isn't lost
function renderInPlaceInventory(){
  const main = document.querySelector('main');
  main.innerHTML = renderInventory();
  document.getElementById('app').querySelectorAll('main [data-action]').forEach(el=>{
    el.onclick = (ev)=> handleAction(el.dataset.action, el.dataset.id, el);
  });
  const catSelect = main.querySelector('[data-input="inv-cat"]');
  if(catSelect) catSelect.onchange = ()=>{ view.invCatFilter = catSelect.value; render(); };
  const searchInput = main.querySelector('[data-input="inv-search"]');
  if(searchInput){
    searchInput.oninput = ()=>{ view.invSearch = searchInput.value; renderInPlaceInventory(); };
  }
}

function handleAction(action, id, el){
  if(action==='add-inventory'){ modal = {type:'inventory-form', payload:{}}; render(); focusFirstField(); }
  else if(action==='edit-inventory'){ modal = {type:'inventory-form', payload:{id}}; render(); focusFirstField(); }
  else if(action==='delete-inventory'){ modal = {type:'confirm', payload:{title:'Delete item?', message:'This removes it from inventory permanently.', onYes:()=>{ state.inventory = state.inventory.filter(i=>i.id!==id); persistAndRender(); }}}; render(); }
  else if(action==='save-inventory'){ saveInventoryFromForm(id); }
  else if(action==='add-employee'){ modal = {type:'employee-form', payload:{}}; render(); focusFirstField(); }
  else if(action==='edit-employee'){ modal = {type:'employee-form', payload:{id}}; render(); focusFirstField(); }
  else if(action==='delete-employee'){ modal = {type:'confirm', payload:{title:'Delete employee?', message:'Their past attendance history will be kept, but they will be removed from the roster.', onYes:()=>{ state.employees = state.employees.filter(e=>e.id!==id); persistAndRender(); }}}; render(); }
  else if(action==='save-employee'){ saveEmployeeFromForm(id); }
  else if(action==='manage-locations'){ modal = {type:'manage-locations', payload:{}}; render(); }
  else if(action==='save-locations'){ saveLocationsFromForm(); }
  else if(action==='close-modal'){ modal = null; render(); }
  else if(action==='confirm-yes'){ if(modal && modal.payload && modal.payload.onYes) modal.payload.onYes(); modal=null; }
  else if(action==='mark-att'){ markAttendance(el.dataset.emp, el.dataset.status, el.dataset.loc); }
  else if(action==='delete-att'){ state.attendance = state.attendance.filter(a=>a.id!==id); persistAndRender(); }
  else if(action==='export-inventory'){ exportInventoryCSV(); }
}

function focusFirstField(){
  setTimeout(()=>{
    const f = document.querySelector('.modal input, .modal select');
    if(f) f.focus();
  },10);
}

function saveInventoryFromForm(id){
  const name = document.getElementById('f-name').value.trim();
  const category = document.getElementById('f-category').value;
  const locationId = document.getElementById('f-location').value;
  const quantity = parseFloat(document.getElementById('f-qty').value)||0;
  const unit = document.getElementById('f-unit').value;
  const unitPrice = parseFloat(document.getElementById('f-price').value)||0;
  const reorderLevel = parseFloat(document.getElementById('f-reorder').value)||0;
  if(!name){ return; }
  if(id){
    const item = state.inventory.find(i=>i.id===id);
    Object.assign(item, {name, category, locationId, quantity, unit, unitPrice, reorderLevel});
  }else{
    state.inventory.push({id:uid(), name, category, locationId, quantity, unit, unitPrice, reorderLevel});
  }
  modal = null;
  persistAndRender();
}

function saveEmployeeFromForm(id){
  const name = document.getElementById('f-ename').value.trim();
  const role = document.getElementById('f-erole').value;
  const locationId = document.getElementById('f-eloc').value;
  if(!name){ return; }
  if(id){
    const e = state.employees.find(x=>x.id===id);
    Object.assign(e, {name, role, locationId});
  }else{
    state.employees.push({id:uid(), name, role, locationId});
  }
  modal = null;
  persistAndRender();
}

function saveLocationsFromForm(){
  document.querySelectorAll('[data-loc-rename]').forEach(inp=>{
    const id = inp.dataset.locRename;
    const val = inp.value.trim();
    if(val){ const l = state.locations.find(x=>x.id===id); if(l) l.name = val; }
  });
  modal = null;
  persistAndRender();
}

function markAttendance(empId, status, locationId){
  const date = view.attDate;
  let rec = state.attendance.find(a=>a.employeeId===empId && a.date===date);
  if(rec && rec.status===status){
    state.attendance = state.attendance.filter(a=>a!==rec);
  }else if(rec){
    rec.status = status;
  }else{
    state.attendance.push({id:uid(), employeeId:empId, date, status, locationId});
  }
  persistAndRender();
}

function exportInventoryCSV(){
  const items = scopedInventory();
  const header = ['Item','Category','Location','Quantity','Unit','Unit Price','Total Value','Status'];
  const rows = items.map(i=>[i.name, i.category, locName(i.locationId), i.quantity, i.unit, i.unitPrice.toFixed(2), (i.quantity*i.unitPrice).toFixed(2), itemStatus(i)]);
  const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'inventory-'+todayStr()+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

loadState();
